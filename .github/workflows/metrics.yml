name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Renders the stats card into github-metrics.svg and commits it to this repo,
      # so the README never depends on a third-party service staying online.
      - uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN (classic PAT, scope: public_repo) gives richer data.
          # Falls back to GITHUB_TOKEN so the workflow still runs without setup.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: LucaPlaster
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
